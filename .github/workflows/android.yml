name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false
          build-scan-publish: false
          build-scan-terms-of-service-url: ""
          build-scan-terms-of-service-agree: "no"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.10.2

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile & Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiYu-Reader-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
